{% extends 'base.html' %}{% block title %}Users{% endblock %}{% block content %}<h1>All Users / Plans</h1><div class="card"><table><tr><th>ID</th><th>Name</th><th>Age</th><th>Weight</th><th>Goal</th><th>Intensity</th><th>Created</th></tr>{% for u in users %}<tr><td>{{u.id}}</td><td>{{u.name}}</td><td>{{u.age}}</td><td>{{u.weight}}</td><td>{{u.goal}}</td><td>{{u.intensity}}</td><td>{{u.created_at}}</td></tr>{% else %}<tr><td colspan="7">No users yet.</td></tr>{% endfor %}</table></div>{% endblock %}
