{% extends 'base.html' %}{% block title %}FitBuddy{% endblock %}{% block content %}<section class="hero"><h1>Build your 7-day fitness plan</h1><p>Enter your details to create a personalized workout and nutrition/recovery tip.</p></section><form class="card" action="/generate-workout" method="post"><label>Name<input name="name" required></label><label>Age<input name="age" type="number" min="13" max="100" required></label><label>Weight (kg)<input name="weight" type="number" min="20" max="400" step="0.1" required></label><label>Goal<select name="goal"><option>Weight loss</option><option>Muscle gain</option><option>General wellness</option><option>Strength</option><option>Endurance</option></select></label><label>Intensity<select name="intensity"><option>Beginner</option><option>Moderate</option><option>Advanced</option></select></label><button>Generate 7-Day Plan</button></form><div class="notice">General fitness information only.</div>{% endblock %}
